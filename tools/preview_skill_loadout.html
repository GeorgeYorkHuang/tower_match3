<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>技能配置页面 · 拆分验收台</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: #0a0e14; color: #c9d6e4;
    font: 13px/1.6 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    display: flex; align-items: center; gap: 16px;
    padding: 10px 18px; border-bottom: 1px solid #1d2836; background: #0d131b; flex: none;
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 700; color: #eaf2ff; letter-spacing: .3px; }
  header .sub { color: #5d7186; font-size: 12px; }
  .badge {
    margin-left: auto; font-size: 12px; padding: 4px 10px; border-radius: 20px;
    background: #14212f; border: 1px solid #23364a; color: #8fa6c2;
  }
  .badge.ok { background: #10241a; border-color: #1f5a37; color: #6fdc9c; }
  .badge.bad { background: #2a1216; border-color: #6b2029; color: #ff8a96; }
  main { display: flex; flex: 1; min-height: 0; }
  aside { flex: none; width: 216px; border-right: 1px solid #1d2836; overflow-y: auto; padding: 12px; background: #0c1119; }
  aside.right { border-right: none; border-left: 1px solid #1d2836; width: 300px; }
  .sec { margin-bottom: 18px; }
  .sec > h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .9px;
    color: #56697e; margin: 0 0 8px; font-weight: 700;
  }
  .scr {
    display: block; width: 100%; text-align: left; cursor: pointer;
    padding: 8px 10px; margin-bottom: 4px; border-radius: 8px;
    background: transparent; border: 1px solid transparent; color: #90a4bb;
    font: inherit; transition: .12s;
  }
  .scr:hover { background: #131c27; color: #c9d6e4; }
  .scr.on { background: #16283c; border-color: #2f6091; color: #eaf2ff; }
  .scr small { display: block; color: #5d7186; font-size: 11px; }
  .scr.on small { color: #7f9cbb; }
  label.row { display: flex; align-items: center; gap: 8px; margin-bottom: 7px; cursor: pointer; color: #a9bdd2; }
  label.row input[type=checkbox] { accent-color: #3a6ea5; width: 14px; height: 14px; }
  select, input[type=range] { width: 100%; }
  select {
    background: #131c27; color: #c9d6e4; border: 1px solid #23364a;
    border-radius: 6px; padding: 5px 7px; font: inherit; margin-bottom: 8px;
  }
  .kv { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px dashed #18222e; }
  .kv b { color: #7f9cbb; font-weight: 500; }
  .kv span { color: #d5e3f2; font-variant-numeric: tabular-nums; }
  .stage { flex: 1; min-width: 0; display: flex; align-items: flex-start; justify-content: center; padding: 16px; overflow: auto; }
  .vp { position: relative; overflow: hidden; border-radius: 10px; background: #0d1522; box-shadow: 0 0 0 1px #22303f, 0 12px 40px #000a; }
  .vp canvas { display: block; transform-origin: top left; }
  .hits { position: absolute; inset: 0; pointer-events: none; }
  .hit {
    position: absolute; border: 1px solid #4dff9e; background: rgba(77,255,158,.10);
    font-size: 9px; color: #b6ffd6; padding: 1px 3px; white-space: nowrap; overflow: hidden;
  }
  .hit.cfg { border-color: #b896ff; background: rgba(184,150,255,.12); color: #e0d0ff; }
  .hit.glb { border-color: #f4cb79; background: rgba(244,203,121,.12); color: #ffe9bf; }
  .hit.cls { border-color: #ff8a96; background: rgba(255,138,150,.14); color: #ffd0d5; }
  .hitlist { font: 11px/1.5 ui-monospace, Consolas, monospace; }
  .hitlist div { padding: 2px 0; border-bottom: 1px dashed #18222e; color: #8fa6c2; }
  .hitlist div b { color: #4dff9e; }
  .note { color: #5d7186; font-size: 11px; line-height: 1.5; }
  .err { color: #ff8a96; font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<header>
  <h1>技能配置页面 · 拆分验收台</h1>
  <span class="sub">旧 render.js 与 screens/skill-loadout.js 同状态绘制 → 像素差分</span>
  <span class="badge" id="status">准备中</span>
</header>
<main>
  <aside class="left">
    <div class="sec">
      <h2>屏幕</h2>
      <div id="screenList"></div>
    </div>
    <div class="sec">
      <h2>玩家状态</h2>
      <select id="stateSel">
        <option value="fresh">新号（仅默认解锁）</option>
        <option value="bought">已购买部分技能</option>
        <option value="custom">自定义装备</option>
      </select>
      <div class="note" id="stateNote"></div>
    </div>
  </aside>

  <section class="stage">
    <div class="vp" id="vp"><canvas id="cv" width="750" height="1626"></canvas><div class="hits" id="hits"></div></div>
  </section>

  <aside class="right">
    <div class="sec">
      <h2>对照</h2>
      <label class="row"><input type="checkbox" id="diff" checked>像素差分（旧 vs 新）</label>
      <label class="row"><input type="checkbox" id="showHits" checked>显示命中区</label>
      <label class="row"><input type="checkbox" id="showLabels" checked>命中区显示键名</label>
      <div class="kv"><b>差异像素</b><span id="diffPx">—</span></div>
      <div class="kv"><b>总像素</b><span id="diffTot">—</span></div>
    </div>
    <div class="sec">
      <h2>缩放</h2>
      <input type="range" id="zoom" min="30" max="140" value="62">
      <div class="kv"><b>显示比例</b><span id="zoomVal">62%</span></div>
    </div>
    <div class="sec">
      <h2>命中区（新实现）</h2>
      <div class="hitlist" id="hitList"></div>
    </div>
    <div class="sec">
      <h2>说明</h2>
      <div class="note">
        两边用同一份状态、同一款图标（icons/skills.js）与面板壳绘制。
        差异像素为 0 表示新模块与旧实现绘制完全一致。
      </div>
    </div>
  </aside>
</main>

<script>
'use strict';

/* ============ 内联 CommonJS 加载器 ============ */
function b64ToUtf8(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
const factories = {};
for (const p in MOD_SRC) {
  const src = b64ToUtf8(MOD_SRC[p]);
  factories[p] = new Function('require', 'module', 'exports', src + '\n//# sourceURL=' + p);
}
function resolvePath(from, req) {
  if (req.charAt(0) !== '.') return req;
  const parts = from.split('/').slice(0, -1).concat(req.split('/'));
  const out = [];
  for (const seg of parts) {
    if (seg === '' || seg === '.') continue;
    if (seg === '..') out.pop(); else out.push(seg);
  }
  return out.join('/');
}
const cache = {};
function makeRequire(from) {
  return function (req) {
    const target = resolvePath(from, req);
    if (cache[target]) return cache[target].exports;
    const f = factories[target];
    if (!f) throw new Error('未内联模块：' + target + '（来自 ' + from + '）');
    const mod = { exports: {} };
    cache[target] = mod;
    f(makeRequire(target), mod, mod.exports);
    return mod.exports;
  };
}
const reqRoot = makeRequire('preview.js');

/* ============ 取得两套实现 ============ */
let Renderer, createSkillLoadout, skillIcon;
try {
  const renderMod = reqRoot('js/game/render.js');
  Renderer = renderMod.Renderer;
  createSkillLoadout = reqRoot('js/game/screens/skill-loadout.js').createSkillLoadout;
  skillIcon = reqRoot('js/game/icons/skills.js').skillIcon;
} catch (e) {
  document.getElementById('status').textContent = '模块加载失败';
  document.getElementById('status').className = 'badge bad';
  document.body.insertAdjacentHTML('beforeend', '<pre class="err">' + String(e.stack || e) + '</pre>');
  throw e;
}

/* 旧实现：不调构造，只借原型方法（这些方法均不依赖实例字段） */
const oldR = Object.create(Renderer.prototype);
const IMPL_OLD = {
  skillCards: (...a) => oldR._menuSkillCards(...a),
  matchCfg: (...a) => oldR.menuMatchCfg(...a),
  globalCfg: (...a) => oldR.menuGlobalCfg(...a),
};
/* 新实现：完全按接入说明注入 */
const IMPL_NEW = (() => {
  const L = createSkillLoadout({
    panelShell: Renderer.prototype._menuPanelShell,
    skillIcon,
    wrapText: Renderer.prototype.wrapText,
  });
  return { skillCards: L.skillCards, matchCfg: L.menuMatchCfg, globalCfg: L.menuGlobalCfg };
})();

/* ============ 状态与屏幕定义 ============ */
const STATES = {
  fresh: {
    note: 'skillUnlocks 为空 → 走 CONFIG.SKILL_UNLOCK.defaults：四连只 unlock 行爆、高连只 unlock 彩虹、连消 unlock 攻击、全局 unlock 洗牌。',
    make: () => ({
      matchSkills: { match4: 'row', match5: 'rainbow', chain: 'attack' },
      globalSkills: { slots: ['shuffle', 'refill'] },
      skillUnlocks: {},
      panel: {},
    }),
  },
  bought: {
    note: '已解锁部分技能：四连 +列爆/十字、高连 +扫描、全局 +锻造/急速。用于检查「已解锁但未配置」与「未解锁可购买」两种状态条。',
    make: () => ({
      matchSkills: { match4: 'row', match5: 'rainbow', chain: 'attack' },
      globalSkills: { slots: ['shuffle', 'forge'] },
      skillUnlocks: {
        match4: ['row', 'col', 'cross'],
        match5: ['rainbow', 'scan'],
        chain: ['attack'],
        global: ['shuffle', 'forge', 'haste'],
      },
      panel: {},
    }),
  },
  custom: {
    note: '双全局槽装了两个不同技能、四连切到随机抽取，用于检查槽位标签与「已配置」高亮。',
    make: () => ({
      matchSkills: { match4: 'random', match5: 'scan', chain: 'attack' },
      globalSkills: { slots: ['haste', 'barrier'] },
      skillUnlocks: { global: ['shuffle', 'haste', 'barrier', 'forge'] },
      panel: {},
    }),
  },
};

const SCREENS = [
  {
    id: 'home', name: '主页技能区', sub: '两行 6 张卡 · y=990 / 1254',
    view: { y: 940, h: 500 },
    draw(L, ctx, s, push) {
      L.skillCards(ctx, s, push, '三消技能', s.matchSkills, 55, 990, 640, 200, true);
      L.skillCards(ctx, s, push, '全局技能', s.globalSkills, 55, 1254, 640, 200, false);
    },
    panel: null,
  },
  {
    id: 'match4', name: '四连技面板', sub: '6 张候选（含随机抽取）',
    view: { y: 180, h: 1060 },
    draw(L, ctx, s, push) { L.matchCfg(ctx, s, push); },
    panel: () => ({ slot: 'match4' }),
  },
  {
    id: 'match5', name: '高连技面板', sub: '4 张候选',

    panel: () => ({ slot: 'chain' }),
  },
  {
    id: 'gp1', name: '全局槽 1 · 第 1 页', sub: '6 条 · 首行有「已配置」',
    view: { y: 180, h: 1060 },
    draw(L, ctx, s, push) { L.globalCfg(ctx, s, push); },
    panel: () => ({ index: 0, page: 0 }),

  {
    id: 'gp3', name: '全局槽 2 · 第 3 页', sub: '末页 · 只有「上一页」',

    panel: () => ({ index: 1, page: 2 }),

];

/* ============ 绘制 ============ */
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const cvB = document.createElement('canvas');
cvB.width = 750; cvB.height = 1626;
const ctxB = cvB.getContext('2d');

let curScreen = SCREENS[0];
/* 支持 #screen=match4&state=bought 直达某屏与某玩家状态 */
const hashSc = (location.hash.match(/screen=(\w+)/) || [])[1];
const hashTarget = SCREENS.find((s) => s.id === hashSc);
if (hashTarget) curScreen = hashTarget;
let curStateKey = STATES[(location.hash.match(/state=(\w+)/) || [])[1]] ? (location.hash.match(/state=(\w+)/) || [])[1] : 'fresh';
let lastHits = [];

function drawInto(context, impl, screen, stateKey) {
  const s = STATES[stateKey].make();
  if (screen.panel) Object.assign(s.panel, screen.panel());
  const hits = [];
  const push = (key, data, x, y, w, h) => hits.push({ key, data, x, y, w, h });
  context.clearRect(0, 0, 750, 1626);
  context.fillStyle = '#0d1522';
  context.fillRect(0, 0, 750, 1626);
  screen.draw(impl, context, s, push);
  return hits;
}

function diffPixels(threshold) {
  const a = ctx.getImageData(0, 0, 750, 1626).data;
  const b = ctxB.getImageData(0, 0, 750, 1626).data;
  const out = ctx.createImageData(750, 1626);
  let n = 0;
  for (let i = 0; i < a.length; i += 4) {
    const d = Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
    if (d > threshold) {
      n++;
      out.data[i] = 255; out.data[i + 1] = 0; out.data[i + 2] = 128; out.data[i + 3] = 200;
    }
  }
  return { n, img: out };
}

function render() {
  const wantDiff = document.getElementById('diff').checked;
  lastHits = drawInto(ctx, IMPL_NEW, curScreen, curStateKey);

  if (wantDiff) {
    drawInto(ctxB, IMPL_OLD, curScreen, curStateKey);
    const { n, img } = diffPixels(8);
    const tot = 750 * 1626;
    document.getElementById('diffPx').textContent = n.toLocaleString();
    document.getElementById('diffTot').textContent = tot.toLocaleString();
    const badge = document.getElementById('status');
    if (n === 0) { badge.textContent = '一致 · 0 差异像素'; badge.className = 'badge ok'; }
    else { badge.textContent = '差异 ' + n.toLocaleString() + ' px'; badge.className = 'badge bad'; }
    if (n > 0) ctx.putImageData(img, 0, 0);
  } else {
    document.getElementById('diffPx').textContent = '—';
    document.getElementById('diffTot').textContent = '—';
    const badge = document.getElementById('status');
    badge.textContent = '仅新实现'; badge.className = 'badge';
  }

  layoutView();
  renderHits();
  renderHitList();
}

/* ============ 视图与命中区 ============ */
let zoomPct = 62;

function layoutView() {
  const vp = document.getElementById('vp');
  const v = curScreen.view;
  const scale = (zoomPct / 100) * 1.0;
  cv.style.width = (750 * scale) + 'px';
  cv.style.height = (1626 * scale) + 'px';
  cv.style.marginTop = (-v.y * scale) + 'px';
  vp.style.width = (750 * scale) + 'px';
  vp.style.height = (v.h * scale) + 'px';
  vp.dataset.scale = String(scale);
  vp.dataset.offy = String(v.y * scale);
}

function hitClass(key) {
  if (key === 'mSkill') return 'hit';
  if (key === 'matchCfg') return 'hit cfg';
  if (key === 'globalCfg') return 'hit glb';
  return 'hit cls';
}

function renderHits() {
  const box = document.getElementById('hits');
  box.innerHTML = '';
  if (!document.getElementById('showHits').checked) return;
  const vp = document.getElementById('vp');
  const scale = Number(vp.dataset.scale), offy = Number(vp.dataset.offy);
  const showLabel = document.getElementById('showLabels').checked;
  for (const h of lastHits) {
    const d = document.createElement('div');
    d.className = hitClass(h.key);
    d.style.left = (h.x * scale) + 'px';
    d.style.top = (h.y * scale - offy) + 'px';
    d.style.width = (h.w * scale) + 'px';
    d.style.height = (h.h * scale) + 'px';
    d.textContent = showLabel ? h.key + (h.data && h.data.slot ? ':' + h.data.slot : '') : '';
    box.appendChild(d);
  }
}

function renderHitList() {
  const el = document.getElementById('hitList');
  el.innerHTML = lastHits.map((h) => {
    const d = h.data === null || h.data === undefined ? ''
      : (typeof h.data === 'object' ? JSON.stringify(h.data) : String(h.data));
    return '<div><b>' + h.key + '</b> ' + d +
      '<br>' + Math.round(h.x) + ',' + Math.round(h.y) + ' · ' +
      Math.round(h.w) + '×' + Math.round(h.h) + '</div>';
  }).join('');
}

/* ============ 交互 ============ */
function buildScreenList() {
  const el = document.getElementById('screenList');
  SCREENS.forEach((sc) => {
    const b = document.createElement('button');
    b.className = 'scr' + (sc === curScreen ? ' on' : '');
    b.innerHTML = sc.name + '<small>' + sc.sub + '</small>';
    b.onclick = () => {
      curScreen = sc;
      location.hash = 'screen=' + sc.id;
      document.querySelectorAll('.scr').forEach((x) => x.classList.remove('on'));
      b.classList.add('on');
      render();
    };
    el.appendChild(b);
  });
}

document.getElementById('stateSel').onchange = (e) => {
  curStateKey = e.target.value;
  document.getElementById('stateNote').textContent = STATES[curStateKey].note;
  render();
};
document.getElementById('diff').onchange = render;
document.getElementById('showHits').onchange = () => { renderHits(); };
document.getElementById('showLabels').onchange = () => { renderHits(); };
