<!doctype html><meta charset="utf-8"><title>Boss正式压缩待机预览</title><style>body{background:#192027;color:#eee;font:16px system-ui;margin:24px}section{display:inline-block;width:290px;margin:10px;vertical-align:top}canvas{width:256px;height:256px;background:#111820}button,select{padding:8px}p{max-width:1000px}</style><h1>Boss正式压缩待机预览</h1><p>使用游戏当前768×128压缩图集，每帧128px。已加透明边距；W40双体在游戏里共用图集并镜像第二体。此处按2倍尺寸检查压缩与播放节奏。</p><button id="play">暂停</button> <button id="step">下一帧</button> <label>维尔德节奏 <select id="timing"><option value="tuned">建议：160/170/200/200/120/120ms</option><option value="original">原版：12fps</option></select></label> <button id="bg">切换棋盘底</button><div id="cards"></div><script>
const defs=[['卡洛斯 v3','../assets/images/monsters/bosses/expansion/carlos-idle-v1.png',125],['维尔德 现行','../assets/images/monsters/bosses/expansion/velde-idle-v1.png',83.333],['伊格尼斯 v3','../assets/images/monsters/bosses/expansion/ignis-idle-v1.png',167],['斯卡尔 运行时','../assets/images/monsters/bosses/expansion/skar-idle-v1.png',100]];let running=true,last=0,checker=false;
const cards=defs.map(([name,src,ms],i)=>{const s=document.createElement('section');s.innerHTML='<h3>'+name+'</h3><canvas width="256" height="256"></canvas><p class="info"></p>';document.querySelector('#cards').append(s);const im=new Image();im.src=src;im.onload=draw;return {im,c:s.querySelector('canvas').getContext('2d'),info:s.querySelector('.info'),frame:0,acc:0,ms,i}});
function draw(){for(const d of cards){const c=d.c;c.clearRect(0,0,256,256);if(checker){for(let y=0;y<256;y+=16)for(let x=0;x<256;x+=16){c.fillStyle=((x+y)/16)%2?'#68727c':'#aab2ba';c.fillRect(x,y,16,16)}}if(d.im.complete&&d.im.naturalWidth){const fw=d.im.naturalWidth/6;c.drawImage(d.im,fw*d.frame,0,fw,d.im.naturalHeight,0,0,256,256)}d.info.textContent='帧 '+(d.frame+1)+'/6 · '+d.im.naturalWidth+'×'+d.im.naturalHeight}}
function duration(d){return d.i===1&&document.querySelector('#timing').value==='tuned'?[160,170,200,200,120,120][d.frame]:d.ms}
function loop(t){const dt=last?Math.min(100,t-last):0;last=t;if(running){for(const d of cards){d.acc+=dt;while(d.acc>=duration(d)){d.acc-=duration(d);d.frame=(d.frame+1)%6}}draw()}requestAnimationFrame(loop)}
document.querySelector('#play').onclick=e=>{running=!running;e.target.textContent=running?'暂停':'播放'};document.querySelector('#step').onclick=()=>{running=false;document.querySelector('#play').textContent='播放';cards.forEach(d=>{d.frame=(d.frame+1)%6;d.acc=0});draw()};document.querySelector('#timing').onchange=()=>cards.forEach(d=>{d.acc=0;d.frame=0});document.querySelector('#bg').onclick=()=>{checker=!checker;draw()};requestAnimationFrame(loop);
</script>
