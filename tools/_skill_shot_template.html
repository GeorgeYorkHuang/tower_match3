<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>skill-loadout 裸渲染</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #0d1522; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="cv" width="750" height="1626"></canvas>
<script>const MOD_SRC = {/*__MODULES__*/};</script>
<script>
window.onerror = function (msg, src, line, col, err) {
  const c = document.getElementById('cv');
  if (c && c.getContext) {
    const x = c.getContext('2d');
    x.fillStyle = '#5a1020'; x.fillRect(0, 0, 750, 120);
    x.fillStyle = '#ffd0d0'; x.font = '20px monospace';
    String(err && err.stack || msg).split('\n').slice(0, 4).forEach((ln, i) => x.fillText(ln.slice(0, 110), 10, 30 + i * 24));
  }
  document.title = 'ERR:' + msg;
};
</script>
<script>
'use strict';

/* ============ 内联 CommonJS 加载器（与验收台模板同一套） ============ */
function b64ToUtf8(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}
const factories = {};
for (const p in MOD_SRC) {
  const src = b64ToUtf8(MOD_SRC[p]);
  factories[p] = new Function('require', 'module', 'exports', src + '\n//# sourceURL=' + p);
}
function resolvePath(from, req) {
  if (req.charAt(0) !== '.') return req;
  const parts = from.split('/').slice(0, -1).concat(req.split('/'));
  const out = [];
  for (const seg of parts) {
    if (seg === '' || seg === '.') continue;
    if (seg === '..') out.pop(); else out.push(seg);
  }
  return out.join('/');
}
const cache = {};
function makeRequire(from) {
  return function (req) {
    const target = resolvePath(from, req);
    if (cache[target]) return cache[target].exports;
    const f = factories[target];
    if (!f) throw new Error('未内联模块：' + target);
    const mod = { exports: {} };
    cache[target] = mod;
    f(makeRequire(target), mod, mod.exports);
    return mod.exports;
  };
}
const reqRoot = makeRequire('shot.js');

/* ============ 取实现 ============ */
const Renderer = reqRoot('js/game/render.js').Renderer;
const createSkillLoadout = reqRoot('js/game/screens/skill-loadout.js').createSkillLoadout;
const skillIcon = reqRoot('js/game/icons/skills.js').skillIcon;
const L = createSkillLoadout({
  panelShell: Renderer.prototype._menuPanelShell,
  skillIcon,
  wrapText: Renderer.prototype.wrapText,
});

/* ============ 状态（与验收台一致） ============ */
const STATES = {
  fresh: () => ({
    matchSkills: { match4: 'row', match5: 'rainbow', chain: 'attack' },
    globalSkills: { slots: ['shuffle', 'refill'] },
    skillUnlocks: {},
    panel: {},
  }),
  bought: () => ({
    matchSkills: { match4: 'row', match5: 'rainbow', chain: 'attack' },
    globalSkills: { slots: ['shuffle', 'forge'] },
    skillUnlocks: {
      match4: ['row', 'col', 'cross'],
      match5: ['rainbow', 'scan'],
      chain: ['attack'],
      global: ['shuffle', 'forge', 'haste'],
    },
    panel: {},
  }),
  custom: () => ({
    matchSkills: { match4: 'random', match5: 'scan', chain: 'attack' },
    globalSkills: { slots: ['haste', 'barrier'] },
    skillUnlocks: { global: ['shuffle', 'haste', 'barrier', 'forge'] },
    panel: {},
  }),
};

const SCREENS = {
  home:   { panel: null },
  match4: { panel: { slot: 'match4' } },
  match5: { panel: { slot: 'match5' } },
  chain:  { panel: { slot: 'chain' } },
  gp1:    { panel: { index: 0, page: 0 } },
  gp2:    { panel: { index: 0, page: 1 } },
  gp3:    { panel: { index: 1, page: 2 } },
};

const hash = (k) => (location.hash.match(new RegExp(k + '=(\\w+)')) || [])[1];
const screenId = hash('screen') || 'home';
const stateKey = hash('state') || 'fresh';
const sc = SCREENS[screenId] || SCREENS.home;
const s = (STATES[stateKey] || STATES.fresh)();
if (sc.panel) Object.assign(s.panel, sc.panel);

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
ctx.fillStyle = '#0d1522';
ctx.fillRect(0, 0, 750, 1626);
const hits = [];
const push = (key, data, x, y, w, h) => hits.push({ key, data, x, y, w, h });

if (screenId === 'home') {
  L.skillCards(ctx, s, push, '三消技能', s.matchSkills, 55, 990, 640, 200, true);
  L.skillCards(ctx, s, push, '全局技能', s.globalSkills, 55, 1254, 640, 200, false);
} else if (sc.panel.slot) {
  L.menuMatchCfg(ctx, s, push);
} else {
  L.menuGlobalCfg(ctx, s, push);
}

/* 完成标记：把命中键写进 title，脚本侧据此判断渲染完成 */
cv.title = 'done:' + screenId + ':' + stateKey + ':' + hits.length;
document.title = 'ok';
</script>
</body>
</html>
